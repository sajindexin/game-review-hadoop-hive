<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>游戏更新反馈 · 问答 Agent</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">游戏更新反馈 <span>·</span> 检索与问答 Agent</div>
  <div class="meta" id="meta">加载中…</div>
</header>

<main class="layout">
  <aside class="sidebar">
    <label class="field">
      <span>游戏</span>
      <select id="game"></select>
    </label>
    <label class="field">
      <span>版本</span>
      <select id="patch"></select>
    </label>
    <div class="card" id="patchCard">
      <div class="card-title">版本卡片</div>
      <div class="muted">选择版本后显示指标</div>
    </div>
    <div class="card">
      <div class="card-title">这个版本官方改了什么</div>
      <ul id="items" class="items"></ul>
    </div>
    <div class="hint">数据版本 v1 · 12 款游戏 · 26 个代表版本 · 75 项官方改动</div>
  </aside>

  <section class="chat">
    <div id="messages" class="messages">
      <div class="msg bot">
        <div class="bubble">
          <p>选择左侧的版本，然后问我：推荐率变化、官方改了什么，或者玩家怎么评价某个改动。</p>
          <p class="muted">每个数字都来自指标表，每条玩家原话都带 Steam 链接；没有证据时我会直接说“暂无已复核引文”。</p>
        </div>
      </div>
    </div>

    <div id="chips" class="chips"></div>

    <form id="askForm" class="composer">
      <input id="question" autocomplete="off" placeholder="例如：1.5 更新后推荐率降了多少？玩家怎么评价姜岛？" />
      <button type="submit">提问</button>
    </form>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
