<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>版本详情 · 演示</title>
<link rel="stylesheet" href="/style.css" />
<style>
  .wrap { max-width: 980px; margin: 0 auto; padding: 20px 22px 40px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .head h1 { font-size: 20px; margin: 0; }
  .back { color: var(--accent); text-decoration: none; font-size: 13px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0; }
  .big { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .big .k { font-size: 12px; color: var(--muted); }
  .big .v { font-size: 24px; font-weight: 700; }
  .big .s { font-size: 11px; color: var(--muted); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-top: 12px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .t { font-weight: 600; }
  .row .d { color: var(--muted); font-size: 12px; flex: 1; }
  .row a { color: var(--accent); font-size: 12px; white-space: nowrap; }
  .note { color: var(--muted); font-size: 12px; margin-top: 14px; }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">版本详情 <span>·</span> 演示页</div>
  <div class="meta">正式页面由石曜铭的 Java Web 实现，这里只用于联调核对</div>
</header>
<main class="wrap" id="app">加载中…</main>
<script src="/version.js"></script>
</body>
</html>
