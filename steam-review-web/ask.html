<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent 问答 · Steam 评测分析台</title>
<link rel="stylesheet" href="assets/steam.css">
</head>
<body>

<header class="global-header" id="siteHeader"></header>
<div class="sub-nav" id="subNav"></div>

<main class="wrap">
  <div class="breadcrumbs">
    <a href="index.html">全部游戏</a><span class="sep">›</span><span>Agent 问答</span>
  </div>

  <div class="flex" style="margin:4px 0 14px">
    <div>
      <div style="font-size:21px;color:#e6edf3">评测问答 Agent</div>
      <div class="small muted" id="ctxLine">载入数据中…</div>
    </div>
    <div class="right">
      <select id="patchSelect" class="chip" style="height:30px;background:#16202d;border-color:#2a475e;color:#c6d4df;padding:0 8px;max-width:360px">
      </select>
    </div>
  </div>

  <div class="chat-shell">
    <div class="chat-panel">
      <div class="chat-head">
        <span class="dot"></span>
        <div>
          <div class="t">Review Analyst</div>
          <div class="s">基于版本窗口统计 + 评测样本回答，回答中会标注数据口径</div>
        </div>
        <span class="right" id="modeTag">本地规则引擎</span>
      </div>
      <div class="chat-body" id="chatBody"></div>
      <form class="chat-input" id="askForm">
        <input id="askInput" type="text" placeholder="例如：这次更新的口碑变化如何？中文玩家怎么看？" autocomplete="off">
        <button class="btn btn-green" type="submit">发送</button>
      </form>
    </div>

    <aside>
      <div class="side-card">
        <h3>示例问题</h3>
        <div id="suggestions"></div>
      </div>
      <div class="side-card">
        <h3>当前上下文</h3>
        <div class="small" id="ctxCard" style="line-height:1.9"></div>
      </div>
      <div class="side-card">
        <h3>接口约定</h3>
        <p>
          页面默认读取离线数据包，接入 Servlet 后在 <code>assets/ask.js</code> 顶部把
          <code>SRW.useBackend</code> 设为 <code>true</code>，即改为调用
          <code>POST /api/ask</code>。
        </p>
      </div>
    </aside>
  </div>
</main>

<footer class="site-footer" id="siteFooter"></footer>

<script src="assets/steam.js"></script>
<script src="assets/ask.js"></script>
</body>
</html>
