[project]
name = "steam-feedback-crawler"
version = "0.1.0"
description = "面向游戏更新反馈分析的 Steam 评价与公告命令行采集工具"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "filelock>=3.16,<4",
    "httpx[socks]>=0.28,<1",
    "truststore>=0.10,<1",
    "tzdata>=2025.1",
]

[project.scripts]
steam-crawler = "steam_crawler.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steam_crawler"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
